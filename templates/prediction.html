<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - GreenClassify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .prediction {
            font-size: 2.5em;
            font-weight: bold;
            margin: 15px 0;
        }
        .confidence {
            font-size: 1.5em;
            opacity: 0.9;
        }
        .uploaded-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .info-text {
            text-align: center;
            color: #718096;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Classification Result</h1>
        
        <div class="result-card">
            <p style="font-size: 1.2em; margin-bottom: 10px;">Detected Vegetable:</p>
            <div class="prediction">{{ prediction }}</div>
            <div class="confidence">Confidence: {{ (confidence * 100)|round|int }}%</div>
        </div>
        
        {% if image_path %}
        <img src="{{ url_for('static', filename=image_path) }}" alt="Uploaded image" class="uploaded-image">
        {% endif %}
        
        <a href="/" class="btn">🔄 Classify Another Image</a>
        
        <p class="info-text">
            💡 This classification is powered by deep learning trained on 15 vegetable categories
        </p>
    </div>
</body>
</html>
